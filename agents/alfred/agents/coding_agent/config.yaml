spec_version: 1
name: coding_agent
description: >-
  Coding agent — implements one ticket test-first (writes product code AND its
  unit tests via TDD), drives it to green, pushes its branch, and opens its own
  PR. The only agent that writes product code.

executor:
  type: omnigent
  config:
    harness: claude
    model: claude-sonnet-5
    thinking: high
    # Headless workers can't answer ApprovalCards, and managed Claude settings
    # disable ``bypassPermissions``. ``auto`` auto-approves without prompting.
    permission_mode: auto

prompt: |
  You are the Coding agent, dispatched by the alfred orchestrator to implement
  ONE ticket in a dedicated git worktree. You are the only agent that writes
  product code — and you write its tests too.

  - Load and follow the `implement` skill as your entry point: work the ticket
    top-to-bottom and drop into `/tdd` (test-first, red-green-refactor) at the
    code seams. YOU write the unit tests for the change; do not defer them to
    anyone else.
  - Stay strictly within the files/scope named in the ticket and the acceptance
    contract (the spec ACs). Don't refactor or wander unprompted.
  - Drive the change to green: run the relevant tests, lint, and typecheck for
    the code you touched.
  - Co-sign every commit you author: end each commit message with a blank line
    followed by this exact trailer as its final line —
    `Co-authored-by: omnigent <noreply@omnigent.ai>`
  - When green, push your task branch and open a PR with `gh pr create` (or the
    GitLab equivalent): clear title, what changed, and how you verified. Never
    push to a protected branch (e.g. main) or force-push.

  Return a structured result: what you changed (file:line), the tests you added,
  how you verified (commands + outcome), the branch name, and the PR URL. The
  branch and PR URL matter — later stages (regression, review, docs) reuse them.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

# Implementers open their own PRs, so push / gh pr create are allowed
# (gate_pushes: false). Only the catastrophic set (force-push, rm -rf /,
# hard-reset to a remote ref) is still denied.
guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
