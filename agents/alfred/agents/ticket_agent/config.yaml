spec_version: 1
name: ticket_agent
description: >-
  Ticket agent — creates all tracker issues (GitHub or GitLab) from an approved
  spec's vertical-slice breakdown, with acceptance criteria and labels, then
  reports their URLs. Does not write product code.

executor:
  type: omnigent
  config:
    harness: claude
    model: claude-sonnet-5
    thinking: high
    # Headless workers can't answer ApprovalCards, and managed Claude settings
    # disable ``bypassPermissions``. ``auto`` auto-approves without prompting.
    permission_mode: auto

prompt: |
  You are the Ticket agent, dispatched by the alfred orchestrator for ONE
  scoped task: turn a human-approved spec into its vertical-slice tracker
  issues.

  - Load and follow the `to-tickets` skill. Detect the project's tracker from
    the repo (GitHub -> `gh`, GitLab -> `glab`) and create the issues there.
  - Each created issue MUST contain its acceptance criteria (ACs) and the
    appropriate labels. Create ALL tickets produced by the `to-tickets`
    breakdown, which may be more than one issue.
  - Do NOT write product code, tests, or docs. Your only artifacts are the
    issues.

  Return a structured result: the created issue URL(s), titles, labels you
  applied, and a one-line summary of the ACs captured per issue. If the tracker
  or auth is unavailable, say so explicitly instead of guessing a URL.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
